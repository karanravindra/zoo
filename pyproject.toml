[project]
name = "zoo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karan Ravindra", email = "21176108+karanravindra@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "awkward>=2.15.0",
    "cut-cross-entropy",
    "datasets>=5.2.0",
    "dtour[cev]>=0.5.3",
    "gigatoken>=0.11.0",
    "lightning>=2.6.6",
    "lpips>=0.1.4",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "nvidia-ml-py>=13.615.71",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torch-fidelity>=0.4.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "transformers>=5.22.2",
    "tyro>=1.0.17",
    "umap-learn>=0.6.0",
    "wandb>=0.31.2",
    "wigglystuff==0.6.0",
]

[dependency-groups]
# projects/ledger only: `uv run --group ledger projects/ledger/<script>.py`
ledger = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "flash-linear-attention>=0.6.0",
    "peft>=0.21.3",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]
pretrain = [
    "anthropic>=2.12.0",
    "openai>=3.57.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
cut-cross-entropy = { git = "https://github.com/apple/ml-cross-entropy.git" }
