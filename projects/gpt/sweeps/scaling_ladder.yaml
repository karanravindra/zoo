# Scaling-law study, step 2: the ladder. Eight sizes (aspect 64: width = 64 x layers, 0.9M to 88M parameters), each trained to
# 1e17 FLOPs on TinyStories, or to one pass over the corpus (29,500 steps, 483M tokens) when that comes first, which it does up to
# 8 layers. With a constant LR and an EMA the validation rows of one run are the results of every shorter budget too, so a run is a
# whole loss-versus-compute curve. The learning rate is the rule of `cli.py fit-lr` (scaling_lr.yaml): 2e-3 at width 256, falling as
# 1 / width (`lr_width_exp 1`). The bracket and seed sweeps (scaling_bracket.yaml, scaling_seeds.yaml) add to this group.
#   uv run wandb sweep --project gpt projects/gpt/sweeps/scaling_ladder.yaml
#   uv run wandb agent <entity>/gpt/<sweep id>
# Then `uv run projects/gpt/cli.py fit-scaling` (group tinystories-ladder).
program: projects/gpt/cli.py
method: grid
name: scaling-ladder
metric:
  name: val/loss
  goal: minimize
parameters:
  n_layers:
    values: [2, 3, 4, 5, 6, 8, 10, 12]
  aspect:
    value: 64
  max_flops:
    value: 1.0e+17
  lr:
    value: 2.0e-3
  lr_width_exp:
    value: 1.0
  val_every:
    value: 500
  ema:
    value: 0.99999
  sample_tokens:
    value: 0
  group:
    value: tinystories-ladder
command:
  - uv
  - run
  - ${program}
  - pretrain
  - ${args}
