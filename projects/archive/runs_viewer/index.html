<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Runs Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --panel: #ffffff;
        --well: #f0f1f4;
        --hover: #eceef2;
        --rule: #e1e4e8;
        --rule-strong: #c9ced5;
        --ink: #1a1d21;
        --ink-2: #4b525c;
        --ink-3: #8a919b;
        --accent: #e8a33d;       /* active tab, sliders */
        --link: #2f6fd6;
        --good: #2f9e6a;
        --bad: #d64545;
        --top: #1b1e23;          /* top bar */
        --top-ink: #e9ecf0;
        --top-ink-2: #9aa2ad;
        --shadow: 0 10px 30px -10px rgb(15 20 30 / 0.35);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --bg: #121418;
          --panel: #1a1d22;
          --well: #22262c;
          --hover: #262a31;
          --rule: #2b3037;
          --rule-strong: #3a414a;
          --ink: #e6e9ed;
          --ink-2: #b0b7c1;
          --ink-3: #7c848f;
          --link: #6aa3ff;
          --good: #42b883;
          --bad: #f06a6a;
          --top: #0c0d10;
          --shadow: 0 10px 30px -10px rgb(0 0 0 / 0.7);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--ink);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        font-size: 13px; line-height: 1.45;
        font-variant-numeric: tabular-nums;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        grid-template-rows: 48px minmax(0, 1fr);
        height: 100vh; overflow: hidden;
      }
      :focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
      [hidden] { display: none !important; }
      select, input, button { font: inherit; color: var(--ink); }
      input[type="search"], input[type="number"], select {
        background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 6px;
        padding: 4px 8px; min-height: 30px;
      }
      button {
        background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 6px;
        padding: 4px 12px; min-height: 30px; cursor: pointer; white-space: nowrap;
      }
      button:hover:not(:disabled) { background: var(--hover); }
      button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); font-weight: 600; }
      button.primary:hover:not(:disabled) { background: var(--ink-2); }
      button.ghost { background: none; border-color: transparent; color: var(--ink-2); }
      button.ghost:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
      button.icon { padding: 0; width: 26px; min-height: 26px; height: 26px; display: inline-grid; place-items: center; }
      button.icon svg { width: 15px; height: 15px; }
      .mono, code { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
      input[type="range"] { accent-color: var(--accent); }
      a { color: var(--link); text-decoration: none; cursor: pointer; }
      a:hover { text-decoration: underline; }

      /* --- top bar --------------------------------------------------------- */
      header {
        grid-column: 1 / -1; background: var(--top); color: var(--top-ink);
        display: flex; align-items: center; gap: 16px; padding: 0 14px; min-width: 0;
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; font-size: 14px; }
      .brand .logo { width: 18px; height: 18px; border-radius: 4px; background: var(--accent); display: grid; place-items: center; }
      .brand .logo svg { width: 12px; height: 12px; }
      .crumb { color: var(--top-ink-2); }
      header select {
        background: transparent; color: var(--top-ink); border-color: #3a4049; min-height: 28px;
        font-weight: 600; max-width: 260px;
      }
      header select option { color: initial; background: initial; }
      nav.tabs { display: flex; align-self: stretch; gap: 2px; }
      nav.tabs a {
        display: flex; align-items: center; padding: 0 12px; color: var(--top-ink-2); font-weight: 500;
        border-bottom: 2px solid transparent; text-decoration: none;
      }
      nav.tabs a:hover { color: var(--top-ink); }
      nav.tabs a[aria-current="page"] { color: var(--top-ink); border-bottom-color: var(--accent); }
      header .spacer { flex: 1; }
      .live { display: inline-flex; gap: 6px; align-items: center; color: var(--top-ink-2); font-size: 12px; }
      .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
      .live.off i { background: var(--bad); }

      /* --- runs sidebar ---------------------------------------------------- */
      aside {
        background: var(--panel); border-right: 1px solid var(--rule);
        display: flex; flex-direction: column; min-height: 0;
      }
      .side-head { padding: 12px 12px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--rule); }
      .side-head .title { display: flex; align-items: center; gap: 4px; font-weight: 600; }
      .side-head .title .n { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
      .side-head .title .spacer { flex: 1; }
      .side-head .title button { min-height: 24px; padding: 0 8px; font-size: 12px; font-weight: 400; }
      .side-head input { width: 100%; }
      #run-list { flex: 1; overflow: auto; padding: 4px 0 12px; }
      .run-row {
        display: grid; grid-template-columns: 26px 12px minmax(0, 1fr) auto; gap: 6px; align-items: center;
        padding: 1px 10px 1px 6px; min-height: 30px;
      }
      .run-row:hover, .run-row.hl { background: var(--hover); }
      .run-row.off .name, .run-row.off .metric { color: var(--ink-3); }
      .run-row.off .swatch { opacity: 0.3; }
      .run-row .eye { color: var(--ink-3); }
      .run-row:not(.off) .eye { color: var(--ink-2); }
      .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
      .run-row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
      .run-row .metric { color: var(--ink-3); font-size: 12px; }
      .state { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; vertical-align: 1px; }
      .state.running { background: var(--accent); animation: pulse 1.3s ease-in-out infinite; }
      .state.stopped { border: 1.5px solid var(--ink-3); }
      .state.done { background: var(--good); }
      @keyframes pulse { 50% { opacity: 0.3; } }
      .side-foot { padding: 8px 12px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 12px; }

      /* --- main ------------------------------------------------------------ */
      main { overflow: auto; min-width: 0; }
      .toolbar {
        position: sticky; top: 0; z-index: 5;
        display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap;
        padding: 10px 18px; background: color-mix(in srgb, var(--bg) 92%, transparent);
        backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule);
      }
      .toolbar label { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-2); }
      .toolbar input[type="search"] { width: 240px; }
      .toolbar input[type="number"] { width: 64px; min-height: 26px; padding: 2px 6px; }
      .toolbar input[type="range"] { width: 120px; }
      .toolbar .spacer { flex: 1; }
      .content { padding: 14px 18px 60px; display: grid; gap: 10px; }
      .empty { color: var(--ink-2); padding: 48px 24px; text-align: center; }

      .section > summary {
        list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
        padding: 6px 2px; font-weight: 600; font-size: 14px; user-select: none;
      }
      .section > summary::-webkit-details-marker { display: none; }
      .section > summary .chev { transition: transform 0.12s; color: var(--ink-3); display: inline-grid; }
      .section > summary .chev svg { width: 14px; height: 14px; }
      .section[open] > summary .chev { transform: rotate(90deg); }
      .section > summary .n { color: var(--ink-3); font-weight: 400; font-size: 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; padding: 6px 0 10px; }

      .panel {
        background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
        padding: 8px 12px 6px; min-width: 0; position: relative;
      }
      .panel:hover { border-color: var(--rule-strong); }
      .panel .ph { display: flex; align-items: center; gap: 4px; min-height: 26px; }
      .panel .ph .t { font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .panel .tools { display: flex; gap: 2px; opacity: 0; transition: opacity 0.1s; }
      .panel:hover .tools, .panel:focus-within .tools { opacity: 1; }
      .panel .tools button { color: var(--ink-3); font-size: 11px; font-weight: 600; }
      .panel .tools button:hover { color: var(--ink); }
      .panel .tools button[aria-pressed="true"] { color: var(--ink); background: var(--well); border-color: var(--rule-strong); }
      .chart { position: relative; user-select: none; }
      .chart svg.plot { display: block; width: 100%; overflow: visible; cursor: crosshair; }
      .chart .axis text { fill: var(--ink-3); font-size: 10.5px; }
      .chart .axis .label { fill: var(--ink-2); font-size: 11px; }
      .chart .gridl { stroke: var(--rule); }
      .chart .raw { fill: none; stroke-width: 1; opacity: 0.25; }
      .chart .line { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
      .chart .dim { opacity: 0.2; }
      .chart .raw.dim { opacity: 0.06; }
      .chart .line.hl { stroke-width: 2.6; }
      .chart circle.pt { stroke: var(--panel); stroke-width: 1.2; }
      .chart .xhair { stroke: var(--ink-3); stroke-width: 1; }
      .chart .brush { fill: var(--link); fill-opacity: 0.12; stroke: var(--link); stroke-opacity: 0.5; }
      .chart .nodata { color: var(--ink-3); text-align: center; padding: 80px 0; }
      .chart .zoomed { position: absolute; right: 2px; top: 0; font-size: 11px; color: var(--ink-3); }
      .legend { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--ink-2); font-size: 12px; margin: 0 0 4px; }
      .legend span { display: inline-flex; gap: 5px; align-items: center; }
      .legend svg { width: 18px; height: 6px; flex: none; }

      .tip {
        position: fixed; z-index: 50; pointer-events: none; display: none;
        background: var(--panel); border: 1px solid var(--rule-strong); border-radius: 6px;
        box-shadow: var(--shadow); padding: 6px 0; font-size: 12px; min-width: 210px; max-width: 440px;
      }
      .tip .h { padding: 0 10px 4px; color: var(--ink-3); border-bottom: 1px solid var(--rule); margin-bottom: 3px; }
      .tip .r { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 1px 10px; }
      .tip .r.hl { background: var(--hover); font-weight: 600; }
      .tip .r .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tip .r .v { font-weight: 600; text-align: right; }
      .tip .r .v small { color: var(--ink-3); font-weight: 400; margin-left: 4px; }
      .tip .sw { width: 10px; height: 10px; border-radius: 2px; }

      /* --- tables & run page ----------------------------------------------- */
      .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; min-width: 0; }
      .card > h3 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; }
      .card > h3 .spacer { flex: 1; }
      .card > h3 label { font-weight: 400; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; }
      .card .body { padding: 4px 14px 8px; }
      .table-wrap { overflow: auto; max-height: calc(100vh - 150px); }
      table { border-collapse: separate; border-spacing: 0; width: 100%; }
      th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
      thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; font-weight: 600; color: var(--ink-2); font-size: 12px; }
      thead tr.cols th { cursor: pointer; top: 28px; }
      thead tr.cols th:hover { color: var(--ink); }
      thead tr.grp th { color: var(--ink-3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; height: 28px; }
      thead th.sorted::after { content: " ↓"; color: var(--ink-3); }
      thead th.sorted.asc::after { content: " ↑"; }
      tbody tr:hover td { background: var(--hover); }
      tbody tr.off td { color: var(--ink-3); }
      td.num, th.num { text-align: right; }
      td.best { color: var(--good); font-weight: 600; }
      .sep { border-left: 1px solid var(--rule); }
      td .swatch { vertical-align: -1px; margin-right: 8px; }
      .kv { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; }
      .kv > div { padding: 5px 0; border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
      .kv > div:nth-child(odd) { color: var(--ink-2); padding-right: 24px; }
      .kv > div:nth-last-child(-n + 2) { border-bottom: none; }
      .kv > div.num { text-align: right; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }
      .run-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .run-head h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
      .run-head .swatch { width: 14px; height: 14px; }
      .pill { padding: 2px 9px; border-radius: 999px; background: var(--well); color: var(--ink-2); font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
      .pill .state { margin: 0; }
      .pill.warn { color: var(--bad); }
      .back { color: var(--ink-2); }

      /* --- dialogs --------------------------------------------------------- */
      dialog {
        border: 1px solid var(--rule-strong); border-radius: 10px; padding: 0; background: var(--panel); color: var(--ink);
        box-shadow: var(--shadow); width: min(1200px, 94vw); max-height: 92vh;
      }
      dialog::backdrop { background: rgb(10 12 16 / 0.55); }
      dialog .dh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--rule); font-weight: 600; }
      dialog .dh .spacer { flex: 1; }
      dialog .db { padding: 14px; overflow: auto; max-height: calc(92vh - 110px); }
      dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--rule); }
      .editor { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; }
      .editor .form { display: grid; gap: 14px; align-content: start; }
      .editor .form > label, .editor .form .fld { display: grid; gap: 4px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
      .editor .form .row { display: flex; gap: 14px; flex-wrap: wrap; }
      .editor .form .row label { display: inline-flex; gap: 6px; align-items: center; font-weight: 400; color: var(--ink); font-size: 13px; }
      .seg { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 6px; overflow: hidden; width: fit-content; }
      .seg button { border: none; border-radius: 0; min-height: 28px; padding: 2px 12px; }
      .seg button + button { border-left: 1px solid var(--rule-strong); }
      .seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
      .ychips { display: flex; flex-wrap: wrap; gap: 4px; }
      .ychip { min-height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12px; background: var(--well); border-color: var(--rule); color: var(--ink); }
      .ychip:hover { border-color: var(--bad); color: var(--bad); }

      @media (max-width: 800px) {
        body { grid-template-columns: 1fr; grid-template-rows: 48px 34vh minmax(0, 1fr); }
        aside { border-right: none; border-bottom: 1px solid var(--rule); }
        .grid { grid-template-columns: 1fr; }
        .toolbar input[type="search"] { width: 100%; }
        .editor { grid-template-columns: 1fr; }
        header .crumb, header .live span { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 12 12" fill="none" stroke="#1a1d21" stroke-width="1.8" stroke-linecap="round"><path d="M1 10 L4 5 L7 7 L11 2" /></svg></span>
        runs
      </div>
      <span class="crumb">/</span>
      <select id="group" aria-label="Project"></select>
      <nav class="tabs">
        <a id="tab-charts" href="#">Workspace</a>
        <a id="tab-table" href="#">Runs table</a>
      </nav>
      <span class="spacer"></span>
      <span class="live" id="live"><i></i><span>live</span></span>
    </header>
    <aside>
      <div class="side-head">
        <div class="title">Runs <span class="n" id="run-count"></span><span class="spacer"></span>
          <button class="ghost" id="show-all">Show all</button>
          <button class="ghost" id="hide-all">Hide all</button>
        </div>
        <input id="filter" type="search" placeholder="Search runs (name or config)" aria-label="Search runs" />
      </div>
      <div id="run-list"></div>
      <div class="side-foot" id="side-foot"></div>
    </aside>
    <main id="main"></main>
    <div class="tip" id="tip"></div>
    <dialog id="dlg"></dialog>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
